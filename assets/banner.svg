<svg viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b1a"/>
      <stop offset="50%" stop-color="#0a1128"/>
      <stop offset="100%" stop-color="#040814"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="55%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="45%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>
  <circle cx="150" cy="30" r="220" fill="url(#blob1)"/>
  <circle cx="1080" cy="230" r="200" fill="url(#blob2)"/>

  <!-- scattered script glyphs -->
  <g fill="#8fb7d9" opacity="0.35" font-family="system-ui,sans-serif">
    <text x="60" y="60" font-size="20">शुरू करें</text>
    <text x="980" y="55" font-size="18">தொடங்கு</text>
    <text x="90" y="220" font-size="18">শুরু করুন</text>
    <text x="1000" y="215" font-size="20">ಪ್ರಾರಂಭಿಸಿ</text>
    <text x="520" y="245" font-size="16">ਸ਼ੁਰੂ ਕਰੋ</text>
  </g>

  <!-- orb -->
  <circle cx="150" cy="130" r="52" fill="url(#orb)" filter="url(#glow)"/>
  <circle cx="150" cy="130" r="52" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- title -->
  <text x="240" y="120" font-family="system-ui,sans-serif" font-size="54" font-weight="900" fill="url(#title)" letter-spacing="-1">Sampark Mitra</text>
  <text x="242" y="155" font-family="system-ui,sans-serif" font-size="19" fill="#bae6fd" fill-opacity="0.75" font-weight="300">Voice-first rural health triage, in your own language</text>

  <!-- badges row -->
  <g font-family="system-ui,sans-serif" font-size="14" fill="#e2e8f0" fill-opacity="0.85">
    <text x="242" y="195">🎙️ Speak · 🌐 11 Indian languages · 🩺 AI triage · 📍 Nearest facility lookup</text>
  </g>
</svg>
